apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullrag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fullrag
  template:
    metadata:
      labels:
        app: fullrag
    spec:
      containers:
        - name: fullrag
          image: fullrag:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fullrag
spec:
  selector:
    app: fullrag
  ports:
    - port: 80
      targetPort: 8000
